version: 2
builds:
  - id: cattery
    main: ./cmd/cattery
    binary: cattery
    env:
      - CGO_ENABLED=0
    goos: ["linux", "darwin"]
    goarch: ["amd64", "arm64"]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
