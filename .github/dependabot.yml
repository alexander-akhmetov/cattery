version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"

  # The pi extension's typecheck and tests are the only npm consumers, but a
  # stale toolchain still breaks CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # The workflows pin every action to a commit SHA, so nothing else moves them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
